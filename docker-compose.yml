services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustshare-backend
    env_file:
      - ./backend/.env
    ports:
      - "8001:8001"
    volumes:
      - trustshare_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8001}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  trustshare_uploads: