version: "3.9"

services:
  # ─── PostgreSQL Database (User Accounts & RBAC) ───────────────────────────
  db:
    image: postgres:15-alpine
    container_name: trustshare_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustshare
      POSTGRES_PASSWORD: trustshare_secret
      POSTGRES_DB: trustshare_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustshare -d trustshare_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MongoDB (File Metadata & Audit Logs) ─────────────────────────────────
  mongo:
    image: mongo:6-jammy
    container_name: trustshare_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (Session Blacklist & Caching) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trustshare_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustshare_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://trustshare:trustshare_secret@db:5432/trustshare_db
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: trustshare_db
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 50
      SECRET_KEY: supersecretkey_change_in_production_32chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - file_uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ─── Next.js Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: trustshare_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./src:/app/src
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  file_uploads:
