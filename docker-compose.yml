version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustshare
      POSTGRES_PASSWORD: trustshare_pw
      POSTGRES_DB: trustshare
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    # Local dev only: hot-reload on file changes (the Dockerfile's own
    # CMD omits --reload, since that's what Render/Railway run in
    # production — reload has no place there and was the cause of the
    # WatchfilesRustInternalError crash seen in earlier logs).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mongo
      - redis
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads

volumes:
  pg_data:
  mongo_data:
  upload_data:
