version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustshare_backend
    restart: always
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: trustshare_user
      POSTGRES_PASSWORD: trustshare_password
      POSTGRES_DB: trustshare_db
      MONGODB_URI: mongodb://mongodb:27017
      REDIS_URI: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminpassword
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mongodb
      - redis
      - minio

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustshare_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: trustshare_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: trustshare_user
      POSTGRES_PASSWORD: trustshare_password
      POSTGRES_DB: trustshare_db
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7.0
    container_name: trustshare_prod_mongodb
    restart: always
    volumes:
      - prod_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: trustshare_prod_redis
    restart: always
    volumes:
      - prod_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: trustshare_prod_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - prod_minio_data:/data

volumes:
  prod_postgres_data:
  prod_mongo_data:
  prod_redis_data:
  prod_minio_data:
