version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://trustshare:trustshare@postgres:5432/trustshare
      JWT_SECRET_KEY: dev-secret-change-me
      MASTER_ENCRYPTION_KEY: dev-master-key-change-me-32bytes
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /app/storage/encrypted
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - encrypted_storage:/app/storage/encrypted
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustshare
      POSTGRES_PASSWORD: trustshare
      POSTGRES_DB: trustshare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  encrypted_storage:
