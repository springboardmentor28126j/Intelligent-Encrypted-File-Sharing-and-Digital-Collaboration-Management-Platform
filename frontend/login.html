<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrustShare - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at 8% 12%,
                    rgba(59, 130, 246, 0.25),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 92% 85%,
                    rgba(236, 72, 153, 0.25),
                    transparent 28%
                ),
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f5f3ff,
                    #fdf2f8
                );

            position: relative;

            overflow: hidden;
        }


        /* Background decoration */

        body::before {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background: rgba(99, 102, 241, 0.12);

            top: -90px;
            left: -90px;
        }


        body::after {
            content: "";

            position: absolute;

            width: 330px;
            height: 330px;

            border-radius: 50%;

            background: rgba(217, 70, 239, 0.10);

            right: -120px;
            bottom: -130px;
        }


        /* Login Card */

        .container {
            width: 430px;

            max-width: 100%;

            background: rgba(255, 255, 255, 0.97);

            padding: 32px 42px;

            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(79, 70, 229, 0.16),
                0 8px 25px rgba(0, 0, 0, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.9);

            position: relative;

            z-index: 2;

            animation: cardAppear 0.7s ease;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* Logo */

        .logo-box {
            width: 70px;
            height: 70px;

            margin: 0 auto 12px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed,
                    #db2777
                );

            font-size: 34px;

            box-shadow:
                0 12px 25px rgba(99, 102, 241, 0.30);

            animation: floatLogo 3s ease-in-out infinite;
        }


        @keyframes floatLogo {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }

        }


        /* Heading */

        h1 {
            text-align: center;

            margin: 4px 0 5px;

            font-size: 31px;

            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #7c3aed,
                    #db2777
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        .subtitle {
            text-align: center;

            margin: 0 0 20px;

            color: #64748b;

            font-size: 14px;
        }


        /* Secure Login Badge */

        .secure-badge {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            padding: 9px;

            margin-bottom: 18px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #f5f3ff
                );

            border: 1px solid #dbe4ff;

            color: #4f46e5;

            font-size: 12px;

            font-weight: 700;
        }


        /* Labels */

        label {
            display: block;

            margin-top: 14px;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;

            font-weight: 700;
        }


        /* Input wrapper */

        .input-wrapper {
            position: relative;

            width: 100%;
        }


        /* Input icon */

        .input-icon {
            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 16px;

            z-index: 1;
        }


        /* Inputs */

        input {
            width: 100%;

            height: 48px;

            padding: 12px 14px 12px 42px;

            border: 2px solid #e2e8f0;

            border-radius: 11px;

            background: #f8fafc;

            color: #1e293b;

            font-size: 14px;

            outline: none;

            transition: all 0.25s ease;
        }


        input:focus {
            border-color: #6366f1;

            background: white;

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.10);
        }


        input::placeholder {
            color: #94a3b8;
        }


        /* Login Button */

        button {
            width: 100%;

            height: 50px;

            margin-top: 22px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed,
                    #db2777
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 22px rgba(99, 102, 241, 0.28);

            transition: all 0.25s ease;
        }


        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 28px rgba(99, 102, 241, 0.35);
        }


        button:active {
            transform: translateY(0);
        }


        /* Register */

        .register-link {
            text-align: center;

            margin-top: 17px;

            padding: 12px;

            border-radius: 10px;

            background: #f8fafc;

            color: #64748b;

            font-size: 13px;

            border: 1px solid #e2e8f0;
        }


        .register-link a {
            color: #7c3aed;

            font-weight: 800;

            text-decoration: none;

            margin-left: 4px;
        }


        .register-link a:hover {
            color: #db2777;

            text-decoration: underline;
        }


        /* Forgot password */

        .forgot-password {
            text-align: center;

            margin-top: 14px;

            font-size: 13px;
        }


        .forgot-password a {
            color: #7c3aed;

            font-weight: 700;

            text-decoration: none;
        }


        .forgot-password a:hover {
            color: #db2777;

            text-decoration: underline;
        }


        /* Message */

        #message {
            margin-top: 12px;

            text-align: center;

            min-height: 18px;

            font-size: 13px;

            font-weight: 700;
        }


        /* Back */

        .back {
            text-align: center;

            margin-top: 13px;

            font-size: 13px;
        }


        .back a {
            color: #4f46e5;

            font-weight: 700;

            text-decoration: none;
        }


        .back a:hover {
            color: #db2777;

            text-decoration: underline;
        }


        /* Security information */

        .security-info {
            margin-top: 17px;

            padding: 10px;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #f0fdf4,
                    #ecfeff
                );

            border: 1px solid #d1fae5;

            color: #166534;

            text-align: center;

            font-size: 11px;

            line-height: 1.4;
        }


        /* Mobile */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }


            .container {
                padding: 27px 23px;

                border-radius: 20px;
            }


            .logo-box {
                width: 62px;
                height: 62px;

                font-size: 30px;
            }


            h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- TrustShare Logo -->

    <div class="logo-box">
        🔐
    </div>


    <!-- Title -->

    <h1>
        TrustShare
    </h1>


    <p class="subtitle">
        Secure File Sharing System
    </p>


    <!-- Security Badge -->

    <div class="secure-badge">

        🛡️

        <span>
            Secure Login • Protected by JWT
        </span>

    </div>


    <!-- Login Form -->

    <form id="loginForm">


        <!-- Email -->

        <label for="email">
            Email Address
        </label>


        <div class="input-wrapper">

            <span class="input-icon">
                📧
            </span>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>


        <!-- Password -->

        <label for="password">
            Password
        </label>


        <div class="input-wrapper">

            <span class="input-icon">
                🔑
            </span>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>


        <!-- Login -->

        <button type="submit">
            🔐 Login Securely
        </button>


    </form>


    <!-- Register - Directly below Login -->

    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>


    <!-- Forgot Password -->

    <div class="forgot-password">

        <a href="forgot-password.html">
            Forgot Password?
        </a>

    </div>


    <!-- Login Message -->

    <div id="message"></div>


    <!-- Back to Home -->

    <div class="back">

        <a href="index.html">
            ← Back to Home
        </a>

    </div>


    <!-- Security Information -->

    <div class="security-info">

        🔒 Your account is protected with
        password hashing and JWT authentication.

    </div>


</div>



<script>


/* ==========================================
   LOGIN FUNCTIONALITY
   ========================================== */


const loginForm =
    document.getElementById("loginForm");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* Get email */

        const email =
            document
                .getElementById("email")
                .value
                .trim();


        /* Get password */

        const password =
            document
                .getElementById("password")
                .value;


        /* Message element */

        const message =
            document.getElementById("message");


        message.innerText =
            "🔄 Logging in...";

        message.style.color =
            "#4f46e5";


        try {


            /* ==========================================
               LOGIN API
               ========================================== */


            const url =
                "http://127.0.0.1:8000/login"
                + "?email="
                + encodeURIComponent(email)
                + "&password="
                + encodeURIComponent(password);


            const response =
                await fetch(
                    url,
                    {
                        method: "POST"
                    }
                );


            const data =
                await response.json();


            console.log(
                "Login response:",
                data
            );


            /* ==========================================
               SUCCESS
               ========================================== */


            if (
                response.ok &&
                data.access_token
            ) {


                /* Store JWT */

                localStorage.setItem(
                    "access_token",
                    data.access_token
                );


                /* Store User ID */

                localStorage.setItem(
                    "user_id",
                    data.user_id
                );


                /* Store User Name */

                localStorage.setItem(
                    "user_name",
                    data.name
                );


                /* Store User Email */

                localStorage.setItem(
                    "user_email",
                    data.email
                );


                /* Store User Role */

                localStorage.setItem(
                    "user_role",
                    data.role
                );


                /* Success message */

                message.innerText =
                    "✅ Login successful!";

                message.style.color =
                    "#16a34a";


                /* Go to Dashboard */

                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    600
                );


            }


            /* ==========================================
               LOGIN FAILED
               ========================================== */


            else {


                message.innerText =
                    "❌ "
                    +
                    (
                        data.message
                        ||
                        data.detail
                        ||
                        "Invalid email or password."
                    );


                message.style.color =
                    "#dc2626";

            }


        }


        /* ==========================================
           SERVER CONNECTION ERROR
           ========================================== */


        catch (error) {


            console.error(
                "Login error:",
                error
            );


            message.innerText =
                "⚠️ Cannot connect to the TrustShare server.";

            message.style.color =
                "#dc2626";

        }

    }
);


</script>


</body>

</html>
