<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - TrustShare</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                TrustShare
            </div>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
            </div>

        </nav>
    </header>


    <!-- Login Section -->
    <main>

        <section class="auth-section">

            <div class="auth-card">

                <h1>Welcome Back</h1>

                <p class="auth-subtitle">
                    Login to your TrustShare account
                </p>


                <!-- Login Form -->
                <form id="loginForm">

                    <!-- Email -->
                    <div class="form-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- Remember Me -->
                    <div class="checkbox-group">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <label for="rememberMe">
                            Remember me
                        </label>

                    </div>


                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Login
                    </button>

                    <div class="forgot-password">
    <a href="forgot-password.html">Forgot Password?</a>
</div>
                    <!-- Login Message -->
                    <p id="loginMessage"></p>

                </form>


                <!-- Register Link -->
                <p class="auth-footer">

                    Don't have an account?

                    <a href="register.html">
                        Create an account
                    </a>

                </p>

            </div>

        </section>

    </main>



    <script src="js/auth.js"></script>

</body>

</html>
