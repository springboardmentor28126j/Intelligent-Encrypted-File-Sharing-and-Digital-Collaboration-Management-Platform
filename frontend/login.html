<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrustShare - Login</title>

    <style>

        * {

            box-sizing: border-box;

        }

        body {

            margin: 0;

            font-family: "Segoe UI", Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:

                radial-gradient(circle at 8% 12%, rgba(59, 130, 246, 0.25), transparent 25%),

                radial-gradient(circle at 92% 85%, rgba(236, 72, 153, 0.25), transparent 28%),

                linear-gradient(135deg, #eef2ff, #f5f3ff, #fdf2f8);

            position: relative;

            overflow: hidden;

        }

        body::before {

            content: "";

            position: absolute;

            width: 300px;

            height: 300px;

            border-radius: 50%;

            background: rgba(99, 102, 241, 0.12);

            top: -90px;

            left: -90px;

        }

        body::after {

            content: "";

            position: absolute;

            width: 330px;

            height: 330px;

            border-radius: 50%;

            background: rgba(217, 70, 239, 0.10);

            right: -120px;

            bottom: -130px;

        }

        .container {

            width: 430px;

            max-width: 100%;

            background: rgba(255, 255, 255, 0.97);

            padding: 32px 42px;

            border-radius: 24px;

            box-shadow:

                0 25px 60px rgba(79, 70, 229, 0.16),

                0 8px 25px rgba(0, 0, 0, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.9);

            position: relative;

            z-index: 2;

            animation: cardAppear 0.7s ease;

        }

        @keyframes cardAppear {

            from {

                opacity: 0;

                transform: translateY(25px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }

        .logo-box {

            width: 70px;

            height: 70px;

            margin: 0 auto 12px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 20px;

            background: linear-gradient(135deg, #2563eb, #7c3aed, #db2777);

            font-size: 34px;

            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.30);

            animation: floatLogo 3s ease-in-out infinite;

        }

        @keyframes floatLogo {

            0%, 100% {

                transform: translateY(0);

            }

            50% {

                transform: translateY(-5px);

            }

        }

        h1 {

            text-align: center;

            margin: 4px 0 5px;

            font-size: 31px;

            font-weight: 800;

            background: linear-gradient(90deg, #2563eb, #7c3aed, #db2777);

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

        }

        .subtitle {

            text-align: center;

            margin: 0 0 20px;

            color: #64748b;

            font-size: 14px;

        }

        .secure-badge {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            padding: 9px;

            margin-bottom: 18px;

            border-radius: 30px;

            background: linear-gradient(135deg, #eff6ff, #f5f3ff);

            border: 1px solid #dbe4ff;

            color: #4f46e5;

            font-size: 12px;

            font-weight: 700;

        }

        label {

            display: block;

            margin-top: 14px;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;

            font-weight: 700;

        }

        .input-wrapper {

            position: relative;

            width: 100%;

        }

        .input-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 16px;

            z-index: 1;

        }

        input {

            width: 100%;

            height: 48px;

            padding: 12px 14px 12px 42px;

            border: 2px solid #e2e8f0;

            border-radius: 11px;

            background: #f8fafc;

            color: #1e293b;

            font-size: 14px;

            outline: none;

            transition: all 0.25s ease;

        }

        input:focus {

            border-color: #6366f1;

            background: white;

            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.10);

        }

        input::placeholder {

            color: #94a3b8;

        }

        button {

            width: 100%;

            height: 50px;

            margin-top: 22px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(135deg, #2563eb, #7c3aed, #db2777);

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow: 0 10px 22px rgba(99, 102, 241, 0.28);

            transition: all 0.25s ease;

        }

        button:hover {

            transform: translateY(-2px);

            box-shadow: 0 14px 28px rgba(99, 102, 241, 0.35);

        }

        button:disabled {

            opacity: 0.7;

            cursor: not-allowed;

            transform: none;

        }

        .register-link {

            text-align: center;

            margin-top: 17px;

            padding: 12px;

            border-radius: 10px;

            background: #f8fafc;

            color: #64748b;

            font-size: 13px;

            border: 1px solid #e2e8f0;

        }

        .register-link a,

        .forgot-password a,

        .back a {

            color: #7c3aed;

            font-weight: 700;

            text-decoration: none;

        }

        .register-link a {

            margin-left: 4px;

            font-weight: 800;

        }

        .register-link a:hover,

        .forgot-password a:hover,

        .back a:hover {

            color: #db2777;

            text-decoration: underline;

        }

        .forgot-password {

            text-align: center;

            margin-top: 14px;

            font-size: 13px;

        }

        #message {

            margin-top: 12px;

            text-align: center;

            min-height: 18px;

            font-size: 13px;

            font-weight: 700;

            overflow-wrap: anywhere;

        }

        .back {

            text-align: center;

            margin-top: 13px;

            font-size: 13px;

        }

        .security-info {

            margin-top: 17px;

            padding: 10px;

            border-radius: 10px;

            background: linear-gradient(135deg, #f0fdf4, #ecfeff);

            border: 1px solid #d1fae5;

            color: #166534;

            text-align: center;

            font-size: 11px;

            line-height: 1.4;

        }

        @media (max-width: 500px) {

            body {

                padding: 15px;

            }

            .container {

                padding: 27px 23px;

                border-radius: 20px;

            }

            .logo-box {

                width: 62px;

                height: 62px;

                font-size: 30px;

            }

            h1 {

                font-size: 27px;

            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo-box">🔐</div>

        <h1>TrustShare</h1>

        <p class="subtitle">Secure File Sharing System</p>

        <div class="secure-badge">

            🛡️

            <span>Secure Login • Protected by JWT</span>

        </div>

        <form id="loginForm">

            <label for="email">Email Address</label>

            <div class="input-wrapper">

                <span class="input-icon">📧</span>

                <input

                    type="email"

                    id="email"

                    placeholder="Enter your email"

                    autocomplete="email"

                    required

                >

            </div>

            <label for="password">Password</label>

            <div class="input-wrapper">

                <span class="input-icon">🔑</span>

                <input

                    type="password"

                    id="password"

                    placeholder="Enter your password"

                    autocomplete="current-password"

                    required

                >

            </div>

            <button id="loginButton" type="submit">

                🔐 Login Securely

            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="register.html">Register</a>

        </div>

        <div class="forgot-password">

            <a href="forgot-password.html">Forgot Password?</a>

        </div>

        <div id="message" role="status" aria-live="polite"></div>

        <div class="back">

            <a href="index.html">← Back to Home</a>

        </div>

        <div class="security-info">

            🔒 Your account is protected with

            password hashing and JWT authentication.

        </div>

    </div>

    <script>

        const loginForm = document.getElementById("loginForm");

        const loginButton = document.getElementById("loginButton");

        const message = document.getElementById("message");

        const API_URL = "https://trustshare-backend-0o7c.onrender.com";

        /*

         * Display label for this computer.

         * A browser cannot automatically read the Windows hostname.

         * This value is manually configured for your current computer.

         */

        const SYSTEM_NAME = "DESKTOP-CJ2HO89";

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();

            const password = document.getElementById("password").value;

            message.textContent = "🔄 Logging in...";

            message.style.color = "#4f46e5";

            loginButton.disabled = true;

            try {

                const url = new URL(`${API_URL}/login`);

                url.searchParams.set("email", email);

                url.searchParams.set("password", password);

                /*

                 * Send the configured system name to the backend.

                 * The backend must accept this parameter and use it

                 * when creating the login notification.

                 */

                url.searchParams.set("system_name", SYSTEM_NAME);

                const response = await fetch(url.toString(), {

                    method: "POST",

                    headers: {

                        "X-TrustShare-System-Name": SYSTEM_NAME

                    }

                });

                const data = await response.json();

                console.log("Login response:", data);

                if (response.ok && data.access_token) {

                    localStorage.setItem("access_token", data.access_token);

                    localStorage.setItem("user_id", data.user_id);

                    localStorage.setItem("user_name", data.name);

                    localStorage.setItem("user_email", data.email);

                    localStorage.setItem("user_role", data.role);

                    localStorage.setItem("trustshare_system_name", SYSTEM_NAME);

                    message.textContent = "✅ Login successful!";

                    message.style.color = "#16a34a";

                    setTimeout(function () {

                        window.location.href = "dashboard.html";

                    }, 600);

                } else {

                    message.textContent =

                        "❌ " +

                        (data.message ||

                         data.detail ||

                         "Invalid email or password.");

                    message.style.color = "#dc2626";

                }

            } catch (error) {

                console.error("Login error:", error);

                message.textContent =

                    "⚠️ Cannot connect to the TrustShare server.";

                message.style.color = "#dc2626";

            } finally {

                loginButton.disabled = false;

            }

        });

    </script>

</body>

</html>
