<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustShare</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #1f4e79;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #1f4e79;
            color: white;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }

        .button:hover {
            background: #163a5c;
        }

        .register {
            background: #28a745;
        }

        .register:hover {
            background: #218838;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>TrustShare</h1>

        <p>
            Secure Data Sharing Platform
        </p>

        <a href="login.html" class="button">
            Login
        </a>

        <a href="register.html" class="button register">
            Register
        </a>

    </div>

</body>
</html>
