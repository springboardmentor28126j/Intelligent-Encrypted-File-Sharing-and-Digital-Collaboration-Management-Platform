<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrustShare - Share Data</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }


        /* ==============================
           NAVBAR
        ============================== */

        .navbar {
            background: #1f4e79;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .navbar h2 {
            margin: 0;
        }


        .buttons {
            display: flex;
            gap: 10px;
        }


        .dashboard-button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }


        .logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }


        .dashboard-button:hover {
            background: #218838;
        }


        .logout:hover {
            background: #b02a37;
        }


        /* ==============================
           MAIN CONTAINER
        ============================== */

        .container {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
        }


        /* ==============================
           HEADER AND SHARE BOX
        ============================== */

        .header,
        .share-box {
            background: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);

            margin-bottom: 25px;
        }


        h1,
        h2 {
            color: #1f4e79;
        }


        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }


        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }


        /* ==============================
           MULTIPLE FILE SELECT
        ============================== */

        #fileName {
            width: 100%;
            min-height: 150px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }


        #fileName option {
            padding: 10px;
        }


        #fileName option:checked {
            background: #1f4e79;
            color: white;
        }


        .selection-hint {
            margin-top: 7px;
            margin-bottom: 0;
            color: #666;
            font-size: 13px;
        }


        /* ==============================
           SHARE BUTTON
        ============================== */

        .share-button {
            margin-top: 25px;

            background: #1f4e79;
            color: white;

            border: none;

            padding: 12px 25px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 15px;
        }


        .share-button:hover {
            background: #163a5c;
        }


        .share-button:disabled {
            background: #999;
            cursor: not-allowed;
        }


        /* ==============================
           MESSAGE
        ============================== */

        #message {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
        }


    </style>

</head>


<body>


    <!-- ==============================
         NAVIGATION
    ============================== -->

    <div class="navbar">

        <h2>TrustShare</h2>


        <div class="buttons">

            <button
                class="dashboard-button"
                onclick="goToDashboard()">

                Dashboard

            </button>


            <button
                class="logout"
                onclick="logout()">

                Logout

            </button>

        </div>

    </div>



    <!-- ==============================
         MAIN CONTAINER
    ============================== -->

    <div class="container">


        <!-- ==============================
             HEADER
        ============================== -->

        <div class="header">

            <h1>🔐 Share Data</h1>

            <p>
                Securely share your uploaded files
                with another TrustShare user.
            </p>

        </div>



        <!-- ==============================
             SHARE FORM
        ============================== -->

        <div class="share-box">

            <h2>Share Multiple Files</h2>


            <!-- ==============================
                 FILE SELECTION
            ============================== -->

            <label for="fileName">
                Select Files
            </label>


            <select
                id="fileName"
                multiple
                size="6">

                <option value="">
                    Loading files...
                </option>

            </select>


            <p class="selection-hint">
                Hold Ctrl and click to select multiple files.
            </p>



            <!-- ==============================
                 RECIPIENT
            ============================== -->

            <label for="recipientEmail">
                Recipient Email
            </label>


            <input
                type="email"
                id="recipientEmail"
                placeholder="Enter recipient email"
            >



            <!-- ==============================
                 SHARE BUTTON
            ============================== -->

            <button
                class="share-button"
                id="shareButton"
                onclick="shareFiles()">

                Share Selected Files

            </button>


            <!-- ==============================
                 MESSAGE
            ============================== -->

            <div id="message"></div>


        </div>


    </div>



    <script>


        // ==========================================
        // CHECK LOGIN
        // ==========================================

        function checkLogin() {

            const token =
                localStorage.getItem("access_token");


            if (!token) {

                window.location.href =
                    "login.html";

                return false;
            }


            return true;
        }



        // ==========================================
        // LOAD USER'S FILES
        // ==========================================

        async function loadFiles() {

            const token =
                localStorage.getItem("access_token");


            const fileSelect =
                document.getElementById("fileName");


            try {

                const response =
                    await fetch(
                        "http://127.0.0.1:8000/files",
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const data =
                    await response.json();


                // ==========================================
                // TOKEN EXPIRED / INVALID
                // ==========================================

                if (response.status === 401) {

                    localStorage.clear();

                    window.location.href =
                        "login.html";

                    return;
                }



                // ==========================================
                // SERVER ERROR
                // ==========================================

                if (!response.ok) {

                    fileSelect.innerHTML =
                        '<option value="">Unable to load files</option>';

                    return;
                }



                // ==========================================
                // NO FILES
                // ==========================================

                if (
                    !data.files ||
                    data.files.length === 0
                ) {

                    fileSelect.innerHTML =
                        '<option value="">No uploaded files</option>';

                    return;
                }



                // ==========================================
                // CLEAR LOADING MESSAGE
                // ==========================================

                fileSelect.innerHTML = "";



                // ==========================================
                // ADD ALL FILES
                // ==========================================

                data.files.forEach(
                    function(filename) {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            filename;


                        option.textContent =
                            filename;


                        fileSelect.appendChild(
                            option
                        );

                    }
                );

            }


            catch (error) {

                console.error(error);


                fileSelect.innerHTML =
                    '<option value="">Cannot connect to server</option>';

            }

        }



        // ==========================================
        // SHARE MULTIPLE FILES
        // ==========================================

        async function shareFiles() {


            // ==========================================
            // GET SELECTED FILES
            // ==========================================

            const fileSelect =
                document.getElementById("fileName");


            const selectedFiles =
                Array.from(
                    fileSelect.selectedOptions
                )
                .map(
                    function(option) {
                        return option.value;
                    }
                )
                .filter(
                    function(value) {
                        return value !== "";
                    }
                );



            // ==========================================
            // GET RECIPIENT EMAIL
            // ==========================================

            const recipientEmail =
                document.getElementById(
                    "recipientEmail"
                ).value.trim();



            // ==========================================
            // MESSAGE ELEMENT
            // ==========================================

            const message =
                document.getElementById(
                    "message"
                );



            // ==========================================
            // SHARE BUTTON
            // ==========================================

            const shareButton =
                document.getElementById(
                    "shareButton"
                );



            // ==========================================
            // CHECK FILE SELECTION
            // ==========================================

            if (selectedFiles.length === 0) {

                message.innerText =
                    "Please select at least one file.";

                return;
            }



            // ==========================================
            // CHECK EMAIL
            // ==========================================

            if (!recipientEmail) {

                message.innerText =
                    "Please enter recipient email.";

                return;
            }



            // ==========================================
            // GET JWT TOKEN
            // ==========================================

            const token =
                localStorage.getItem(
                    "access_token"
                );


            if (!token) {

                message.innerText =
                    "Please login again.";

                window.location.href =
                    "login.html";

                return;
            }



            // ==========================================
            // DISABLE BUTTON
            // ==========================================

            shareButton.disabled = true;

            shareButton.innerText =
                "Sharing...";



            message.innerText =
                "Sharing "
                + selectedFiles.length
                + " file(s)...";



            // ==========================================
            // COUNTERS
            // ==========================================

            let successCount = 0;

            let failedCount = 0;



            // ==========================================
            // SHARE EACH SELECTED FILE
            // ==========================================

            for (
                const fileName
                of selectedFiles
            ) {


                try {


                    // ==========================================
                    // CALL EXISTING FASTAPI SHARE API
                    // ==========================================

                    const response =
                        await fetch(
                            "http://127.0.0.1:8000/share?filename="
                            + encodeURIComponent(fileName)
                            + "&recipient_email="
                            + encodeURIComponent(recipientEmail),

                            {
                                method: "POST",

                                headers: {

                                    "Authorization":
                                        "Bearer " + token,

                                    "Accept":
                                        "application/json"

                                }
                            }
                        );



                    // ==========================================
                    // READ RESPONSE
                    // ==========================================

                    const data =
                        await response.json();



                    // ==========================================
                    // TOKEN ERROR
                    // ==========================================

                    if (response.status === 401) {

                        message.innerText =
                            "Session expired. Please login again.";

                        localStorage.clear();


                        setTimeout(
                            function() {

                                window.location.href =
                                    "login.html";

                            },
                            1500
                        );


                        return;
                    }



                    // ==========================================
                    // SUCCESS
                    // ==========================================

                    if (response.ok) {

                        successCount++;

                    }


                    // ==========================================
                    // FAILED
                    // ==========================================

                    else {

                        console.error(
                            "Failed to share file:",
                            fileName,
                            data
                        );

                        failedCount++;

                    }

                }


                catch (error) {

                    console.error(
                        "Error sharing file:",
                        fileName,
                        error
                    );

                    failedCount++;

                }

            }



            // ==========================================
            // FINAL RESULT
            // ==========================================

            if (failedCount === 0) {

                message.innerText =
                    successCount
                    + " file(s) shared successfully with "
                    + recipientEmail;

            }


            else {

                message.innerText =
                    successCount
                    + " file(s) shared successfully. "
                    + failedCount
                    + " file(s) failed.";

            }



            // ==========================================
            // CLEAR EMAIL
            // ==========================================

            document.getElementById(
                "recipientEmail"
            ).value = "";



            // ==========================================
            // CLEAR FILE SELECTION
            // ==========================================

            fileSelect.selectedIndex = -1;



            // ==========================================
            // ENABLE BUTTON
            // ==========================================

            shareButton.disabled = false;

            shareButton.innerText =
                "Share Selected Files";

        }



        // ==========================================
        // DASHBOARD
        // ==========================================

        function goToDashboard() {

            window.location.href =
                "dashboard.html";

        }



        // ==========================================
        // LOGOUT
        // ==========================================

        function logout() {

            localStorage.clear();

            window.location.href =
                "login.html";

        }



        // ==========================================
        // START PAGE
        // ==========================================

        if (checkLogin()) {

            loadFiles();

        }


    </script>


</body>

</html>
