<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrustShare - Forgot Password</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1f4e79;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background: #1f4e79;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #163a5c;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #1f4e79;
            line-height: 1.5;
        }

        #tokenBox {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #f4f7fb;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        #tokenBox p {
            margin: 0 0 8px 0;
            font-weight: bold;
            color: #333;
        }

        #resetToken {
            word-break: break-all;
            font-size: 13px;
            color: #555;
        }

        .reset-link {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        .reset-link a {
            color: #1f4e79;
            text-decoration: none;
            font-weight: bold;
        }

        .reset-link a:hover {
            text-decoration: underline;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #1f4e79;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>TrustShare</h1>

    <p class="subtitle">
        Enter your registered email address to reset your password.
    </p>

    <form id="forgotPasswordForm">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your registered email"
            required
        >

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <div id="message"></div>

    <!-- Development token display -->
    <div id="tokenBox">

        <p>
            Password Reset Token:
        </p>

        <div id="resetToken"></div>

    </div>

    <!-- Link to reset-password page -->
    <div class="reset-link" id="resetLink">

        <a href="#" id="resetPasswordLink">
            Continue to Reset Password
        </a>

    </div>

    <div class="back">

        <a href="login.html">
            ← Back to Login
        </a>

    </div>

</div>


<script>

const forgotPasswordForm =
    document.getElementById("forgotPasswordForm");

const message =
    document.getElementById("message");

const tokenBox =
    document.getElementById("tokenBox");

const resetToken =
    document.getElementById("resetToken");

const resetLink =
    document.getElementById("resetLink");

const resetPasswordLink =
    document.getElementById("resetPasswordLink");


forgotPasswordForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        message.innerText =
            "Generating password reset request...";

        tokenBox.style.display = "none";

        resetLink.style.display = "none";

        try {

            const url =
                "http://127.0.0.1:8000/forgot-password"
                + "?email="
                + encodeURIComponent(email);


            const response =
                await fetch(
                    url,
                    {
                        method: "POST"
                    }
                );


            const data =
                await response.json();


            console.log(
                "Forgot password response:",
                data
            );


            /*
             * IMPORTANT:
             *
             * Do NOT use:
             *
             * message.innerText = data;
             *
             * because data is an object.
             *
             * We use data.message instead.
             */


            if (response.ok) {

                message.innerText =
                    data.message ||
                    "If the email is registered, a password reset link has been generated.";


                /*
                 * Development mode:
                 *
                 * Your backend currently returns
                 * the reset_token so that you can
                 * test the reset process.
                 */

                if (data.reset_token) {

                    resetToken.innerText =
                        data.reset_token;

                    tokenBox.style.display =
                        "block";


                    /*
                     * Create a link to reset-password.html
                     * and pass the token in the URL.
                     */

                    resetPasswordLink.href =
                        "reset-password.html?token="
                        + encodeURIComponent(
                            data.reset_token
                        );

                    resetLink.style.display =
                        "block";
                }

            }

            else {

                message.innerText =
                    data.detail ||
                    data.message ||
                    "Unable to process the password reset request.";

            }

        }

        catch (error) {

            console.error(
                "Forgot password error:",
                error
            );


            message.innerText =
                "Cannot connect to the TrustShare server.";

        }

    }
);

</script>

</body>

</html>
