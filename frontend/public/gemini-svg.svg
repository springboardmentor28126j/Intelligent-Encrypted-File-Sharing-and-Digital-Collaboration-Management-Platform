<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  
  <!-- Shield Background -->
  <path d="M256 32 C340 32, 416 64, 432 96 C448 240, 384 400, 256 480 C128 400, 64 240, 80 96 C96 64, 172 32, 256 32 Z" fill="url(#shieldGrad)" />
  
  <!-- Inner Security Ring -->
  <path d="M256 70 C320 70, 380 96, 392 120 C404 235, 350 365, 256 430 C162 365, 108 235, 120 120 C132 96, 192 70, 256 70 Z" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.3" />

  <!-- Sharing Nodes / Connections inside Shield -->
  <g fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Connecting Lines -->
    <line x1="256" y1="180" x2="180" y2="310" />
    <line x1="256" y1="180" x2="332" y2="310" />
    <line x1="180" y1="310" x2="332" y2="310" />
  </g>

  <!-- Nodes (Dots) -->
  <circle cx="256" cy="180" r="28" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="8" />
  <circle cx="180" cy="310" r="24" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="8" />
  <circle cx="332" cy="310" r="24" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="8" />
  
  <!-- Center Lock Symbol in Top Node -->
  <path d="M251 172 v-8 a5 5 0 0 1 10 0 v8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>
