<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrustShare - Register</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1f4e79;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background: #28a745;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #1f4e79;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 15px;
        }

        .back a {
            color: #666;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>TrustShare</h1>

        <p class="subtitle">Create your account</p>

        <form id="registerForm">

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <div id="message"></div>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <div class="back">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>


    <script>

        const registerForm = document.getElementById("registerForm");

        registerForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const message = document.getElementById("message");

            message.innerText = "Creating account...";

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/register?name="
                    + encodeURIComponent(name)
                    + "&email="
                    + encodeURIComponent(email)
                    + "&password="
                    + encodeURIComponent(password),
                    {
                        method: "POST"
                    }
                );

                const data = await response.json();

                if (response.ok) {

                    if (data.message === "Registration successful") {

                        message.innerText =
                            "Registration successful!";

                        registerForm.reset();

                        setTimeout(function() {
                            window.location.href = "login.html";
                        }, 1500);

                    } else {

                        message.innerText =
                            data.message;

                    }

                } else {

                    message.innerText =
                        "Registration failed.";

                }

            } catch (error) {

                console.error(error);

                message.innerText =
                    "Cannot connect to the TrustShare server.";

            }

        });

    </script>

</body>
</html>
