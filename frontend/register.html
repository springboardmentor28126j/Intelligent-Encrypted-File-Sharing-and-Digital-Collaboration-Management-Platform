<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - TrustShare</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                TrustShare
            </div>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
            </div>

        </nav>
    </header>


    <!-- Registration Section -->
    <main>

        <section class="auth-section">

            <div class="auth-card">

                <h1>Create Account</h1>

                <p class="auth-subtitle">
                    Create your TrustShare account
                </p>


                <!-- Registration Form -->
                <form id="registerForm">

                    <!-- Full Name -->
                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->
                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <!-- Terms -->
                    <div class="checkbox-group">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <label for="terms">
                            I agree to the terms and conditions
                        </label>

                    </div>


                    <!-- Register Button -->
                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Create Account
                    </button>


                    <!-- Message -->
                    <p id="registerMessage"></p>

                </form>


                <!-- Login Link -->
                <p class="auth-footer">

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
