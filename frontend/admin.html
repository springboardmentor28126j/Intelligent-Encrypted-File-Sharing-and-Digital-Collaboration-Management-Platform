<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TrustShare - Admin Panel</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }


        /* ================================
           NAVIGATION BAR
        ================================= */

        .navbar {

            background: #1f4e79;

            color: white;

            padding: 18px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .navbar h2 {

            margin: 0;

        }


        .navbar-buttons {

            display: flex;

            gap: 10px;

        }


        .back-button,
        .logout {

            border: none;

            padding: 10px 18px;

            border-radius: 6px;

            cursor: pointer;

            color: white;

        }


        .back-button {

            background: #6c757d;

        }


        .back-button:hover {

            background: #5a6268;

        }


        .logout {

            background: #dc3545;

        }


        .logout:hover {

            background: #b02a37;

        }


        /* ================================
           MAIN CONTAINER
        ================================= */

        .container {

            width: 90%;

            max-width: 1100px;

            margin: 40px auto;

        }


        /* ================================
           HEADER
        ================================= */

        .header {

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);

            margin-bottom: 25px;

        }


        .header h1 {

            margin-top: 0;

            color: #1f4e79;

        }


        .header p {

            color: #666;

        }


        /* ================================
           USERS SECTION
        ================================= */

        .users-section {

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);

            overflow-x: auto;

        }


        .users-section h2 {

            color: #1f4e79;

        }


        /* ================================
           TABLE
        ================================= */

        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 20px;

        }


        th,
        td {

            padding: 14px;

            text-align: left;

            border-bottom: 1px solid #ddd;

        }


        th {

            background: #1f4e79;

            color: white;

        }


        tr:hover {

            background: #f5f5f5;

        }


        /* ================================
           ROLE SELECT
        ================================= */

        .role-select {

            padding: 8px;

            border: 1px solid #ccc;

            border-radius: 5px;

        }


        /* ================================
           UPDATE BUTTON
        ================================= */

        .update-button {

            background: #1f4e79;

            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;

            margin-right: 5px;

        }


        .update-button:hover {

            background: #163a5c;

        }


        /* ================================
           DELETE BUTTON
        ================================= */

        .delete-button {

            background: #dc3545;

            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;

        }


        .delete-button:hover {

            background: #b02a37;

        }


        /* ================================
           MESSAGE
        ================================= */

        #message {

            text-align: center;

            margin: 20px 0;

            font-weight: bold;

        }


        .loading {

            text-align: center;

            color: #666;

            padding: 20px;

        }

    </style>

</head>


<body>


    <!-- =====================================
         NAVIGATION BAR
    ====================================== -->

    <div class="navbar">


        <h2>
            TrustShare - Admin
        </h2>


        <div class="navbar-buttons">


            <button
                class="back-button"
                onclick="goDashboard()"
            >

                Dashboard

            </button>


            <button
                class="logout"
                onclick="logout()"
            >

                Logout

            </button>


        </div>

    </div>



    <!-- =====================================
         MAIN CONTAINER
    ====================================== -->

    <div class="container">


        <!-- =================================
             ADMIN HEADER
        ================================== -->

        <div class="header">


            <h1>
                👑 Admin Panel
            </h1>


            <p>
                Manage TrustShare users and their roles.
            </p>


        </div>



        <!-- =================================
             MESSAGE
        ================================== -->

        <div id="message"></div>



        <!-- =================================
             USER MANAGEMENT
        ================================== -->

        <div class="users-section">


            <h2>
                👥 User Management
            </h2>


            <div id="usersContainer">


                <div class="loading">

                    Loading users...

                </div>


            </div>


        </div>


    </div>



    <script>


        // ==========================================
        // BACKEND URL
        // ==========================================

        const API_URL =
            "http://127.0.0.1:8000";



        // ==========================================
        // CHECK ADMIN ACCESS
        // ==========================================

        function checkAdminAccess() {


            const token =
                localStorage.getItem(
                    "access_token"
                );


            const role =
                localStorage.getItem(
                    "user_role"
                );


            // No token

            if (!token) {

                window.location.href =
                    "login.html";

                return false;

            }


            // Not an admin

            if (role !== "admin") {


                alert(
                    "Access denied. Admin privileges required."
                );


                window.location.href =
                    "dashboard.html";


                return false;

            }


            return true;

        }



        // ==========================================
        // SHOW MESSAGE
        // ==========================================

        function showMessage(
            message,
            isError = false
        ) {


            const messageElement =
                document.getElementById(
                    "message"
                );


            messageElement.innerText =
                message;


            if (isError) {

                messageElement.style.color =
                    "#dc3545";

            }

            else {

                messageElement.style.color =
                    "#28a745";

            }

        }



        // ==========================================
        // LOAD USERS
        // ==========================================

        async function loadUsers() {


            const token =
                localStorage.getItem(
                    "access_token"
                );


            try {


                const response =
                    await fetch(
                        API_URL +
                        "/admin/users",
                        {

                            method: "GET",

                            headers: {

                                "Authorization":
                                    "Bearer " + token,

                                "Accept":
                                    "application/json"

                            }

                        }
                    );



                const data =
                    await response.json();



                console.log(
                    "Admin users response:",
                    data
                );



                // ==================================
                // UNAUTHORIZED
                // ==================================

                if (
                    response.status === 401
                ) {


                    localStorage.clear();


                    window.location.href =
                        "login.html";


                    return;

                }



                // ==================================
                // FORBIDDEN
                // ==================================

                if (
                    response.status === 403
                ) {


                    showMessage(
                        "Admin access required.",
                        true
                    );


                    return;

                }



                // ==================================
                // OTHER ERRORS
                // ==================================

                if (!response.ok) {


                    showMessage(
                        data.detail ||
                        "Unable to load users.",
                        true
                    );


                    return;

                }



                // ==================================
                // IMPORTANT
                //
                // Backend response is:
                //
                // {
                //   "message": "...",
                //   "users": [...]
                // }
                //
                // Therefore we use:
                //
                // data.users
                // ==================================

                displayUsers(
                    data.users
                );


            }


            catch (error) {


                console.error(
                    "Load users error:",
                    error
                );


                showMessage(
                    "Cannot connect to TrustShare server.",
                    true
                );

            }

        }



        // ==========================================
        // DISPLAY USERS
        // ==========================================

        function displayUsers(
            users
        ) {


            const container =
                document.getElementById(
                    "usersContainer"
                );



            // No users

            if (
                !users ||
                !Array.isArray(users) ||
                users.length === 0
            ) {


                container.innerHTML = `

                    <p>
                        No users found.
                    </p>

                `;


                return;

            }



            // Start table

            let html = `

                <table>

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Role
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody>

            `;



            // Add users

            users.forEach(
                function(user)
                {


                    html += `

                        <tr>


                            <td>

                                ${user.id}

                            </td>


                            <td>

                                ${user.name}

                            </td>


                            <td>

                                ${user.email}

                            </td>


                            <td>


                                <select
                                    class="role-select"
                                    id="role-${user.id}"
                                >


                                    <option
                                        value="user"
                                        ${
                                            user.role === "user"
                                            ? "selected"
                                            : ""
                                        }
                                    >

                                        User

                                    </option>


                                    <option
                                        value="admin"
                                        ${
                                            user.role === "admin"
                                            ? "selected"
                                            : ""
                                        }
                                    >

                                        Admin

                                    </option>


                                </select>


                            </td>


                            <td>


                                <button
                                    class="update-button"
                                    onclick="updateRole(${user.id})"
                                >

                                    Update Role

                                </button>


                                <button
                                    class="delete-button"
                                    onclick="deleteUser(${user.id})"
                                >

                                    Delete

                                </button>


                            </td>


                        </tr>

                    `;

                }
            );



            // Finish table

            html += `

                    </tbody>

                </table>

            `;



            container.innerHTML =
                html;

        }



        // ==========================================
        // CHANGE USER ROLE
        // ==========================================

        async function updateRole(
            userId
        ) {


            const token =
                localStorage.getItem(
                    "access_token"
                );


            const roleSelect =
                document.getElementById(
                    "role-" + userId
                );


            const newRole =
                roleSelect.value;



            try {


                const response =
                    await fetch(
                        API_URL +
                        "/admin/users/" +
                        userId +
                        "/role?role=" +
                        encodeURIComponent(
                            newRole
                        ),
                        {

                            method: "PUT",

                            headers: {

                                "Authorization":
                                    "Bearer " + token,

                                "Accept":
                                    "application/json"

                            }

                        }
                    );



                const data =
                    await response.json();



                // Forbidden

                if (
                    response.status === 403
                ) {


                    showMessage(
                        "Admin access required.",
                        true
                    );


                    return;

                }



                // Error

                if (!response.ok) {


                    showMessage(
                        data.detail ||
                        "Unable to update user role.",
                        true
                    );


                    return;

                }



                // Success

                showMessage(
                    "User role updated successfully."
                );



                // Reload users

                loadUsers();


            }


            catch (error) {


                console.error(
                    "Update role error:",
                    error
                );


                showMessage(
                    "Cannot connect to TrustShare server.",
                    true
                );

            }

        }



        // ==========================================
        // DELETE USER
        // ==========================================

        async function deleteUser(
            userId
        ) {


            const confirmed =
                confirm(
                    "Are you sure you want to delete this user?"
                );


            if (!confirmed) {

                return;

            }



            const token =
                localStorage.getItem(
                    "access_token"
                );



            try {


                const response =
                    await fetch(
                        API_URL +
                        "/admin/users/" +
                        userId,
                        {

                            method: "DELETE",

                            headers: {

                                "Authorization":
                                    "Bearer " + token,

                                "Accept":
                                    "application/json"

                            }

                        }
                    );



                const data =
                    await response.json();



                // Forbidden

                if (
                    response.status === 403
                ) {


                    showMessage(
                        "Admin access required.",
                        true
                    );


                    return;

                }



                // Error

                if (!response.ok) {


                    showMessage(
                        data.detail ||
                        "Unable to delete user.",
                        true
                    );


                    return;

                }



                // Success

                showMessage(
                    "User deleted successfully."
                );



                // Reload users

                loadUsers();


            }


            catch (error) {


                console.error(
                    "Delete user error:",
                    error
                );


                showMessage(
                    "Cannot connect to TrustShare server.",
                    true
                );

            }

        }



        // ==========================================
        // GO TO DASHBOARD
        // ==========================================

        function goDashboard() {


            window.location.href =
                "dashboard.html";

        }



        // ==========================================
        // LOGOUT
        // ==========================================

        function logout() {


            localStorage.clear();


            window.location.href =
                "login.html";

        }



        // ==========================================
        // START ADMIN PAGE
        // ==========================================

        if (
            checkAdminAccess()
        ) {


            loadUsers();

        }


    </script>


</body>

</html>
