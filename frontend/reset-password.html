<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrustShare - Reset Password</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1f4e79;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1f4e79;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background: #1f4e79;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #163a5c;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .login-link a {
            color: #1f4e79;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #1f4e79;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }

        .password-note {
            font-size: 13px;
            color: #777;
            margin-top: 6px;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>TrustShare</h1>

    <p class="subtitle">
        Create a new password for your account.
    </p>


    <form id="resetPasswordForm">

        <label for="newPassword">
            New Password
        </label>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter your new password"
            required
            minlength="6"
        >

        <div class="password-note">
            Password must be at least 6 characters.
        </div>


        <label for="confirmPassword">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your new password"
            required
            minlength="6"
        >


        <button type="submit">
            Reset Password
        </button>

    </form>


    <div id="message"></div>


    <div class="login-link" id="loginLink">

        <a href="login.html">
            Go to Login
        </a>

    </div>


    <div class="back">

        <a href="login.html">
            ← Back to Login
        </a>

    </div>

</div>


<script>

const resetPasswordForm =
    document.getElementById("resetPasswordForm");

const message =
    document.getElementById("message");

const loginLink =
    document.getElementById("loginLink");


// =========================================================
// Get reset token from URL
// =========================================================

const urlParams =
    new URLSearchParams(window.location.search);

const resetToken =
    urlParams.get("token");


// =========================================================
// Check whether token exists
// =========================================================

if (!resetToken) {

    message.innerText =
        "Invalid or missing password reset token.";

    message.style.color =
        "#dc3545";

    resetPasswordForm.style.display =
        "none";
}


// =========================================================
// Reset Password Form
// =========================================================

resetPasswordForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const newPassword =
            document.getElementById(
                "newPassword"
            ).value;

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        // =====================================================
        // Check password length
        // =====================================================

        if (newPassword.length < 6) {

            message.innerText =
                "Password must be at least 6 characters.";

            message.style.color =
                "#dc3545";

            return;
        }


        // =====================================================
        // Check whether passwords match
        // =====================================================

        if (newPassword !== confirmPassword) {

            message.innerText =
                "Passwords do not match.";

            message.style.color =
                "#dc3545";

            return;
        }


        message.innerText =
            "Resetting password...";

        message.style.color =
            "#1f4e79";


        try {

            // =================================================
            // Create backend URL
            // =================================================

            const url =
                "https://trustshare-backend-0o7c.onrender.com/reset-password"
                + "?token="
                + encodeURIComponent(resetToken)
                + "&new_password="
                + encodeURIComponent(newPassword);


            // =================================================
            // Send request to FastAPI
            // =================================================

            const response =
                await fetch(
                    url,
                    {
                        method: "POST"
                    }
                );


            // =================================================
            // Read backend response
            // =================================================

            const data =
                await response.json();


            console.log(
                "Reset password response:",
                data
            );


            // =================================================
            // Successful password reset
            // =================================================

            if (response.ok) {

                message.innerText =
                    data.message ||
                    "Password reset successful.";

                message.style.color =
                    "#28a745";


                resetPasswordForm.style.display =
                    "none";


                loginLink.style.display =
                    "block";


                /*
                 * After 3 seconds, automatically
                 * go back to login page.
                 */

                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    3000
                );

            }


            // =================================================
            // Backend returned an error
            // =================================================

            else {

                message.innerText =
                    data.detail ||
                    data.message ||
                    "Unable to reset password.";

                message.style.color =
                    "#dc3545";

            }

        }


        // =====================================================
        // Server connection error
        // =====================================================

        catch (error) {

            console.error(
                "Reset password error:",
                error
            );


            message.innerText =
                "Cannot connect to the TrustShare server.";

            message.style.color =
                "#dc3545";

        }

    }
);

</script>

</body>

</html>
